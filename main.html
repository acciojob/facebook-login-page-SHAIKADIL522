<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->

	<main class="page">
		<div class="container">

			<!-- Left: branding -->
			<section class="brand" aria-label="Facebook branding">
				<h1 class="brand__logo">facebook</h1>
				<p class="brand__tagline">
					Facebook helps you connect and share with the people in your life.
				</p>
			</section>

			<!-- Right: login form -->
			<section class="login-card" aria-label="Login">
				<form id="login-form" class="login-form" novalidate>

					<label for="identifier" class="visually-hidden">
						Email address or phone number
					</label>
					<input
						type="text"
						id="identifier"
						name="identifier"
						placeholder="Email address or phone number"
						required
					/>

					<label for="password" class="visually-hidden">Password</label>
					<input
						type="password"
						id="password"
						name="password"
						placeholder="Password"
						required
					/>

					<button type="submit" class="btn btn--primary">Log in</button>

					<a href="#" class="forgot-link">Forgotten account?</a>

					<hr class="divider" />

					<a href="#" class="btn btn--secondary" id="create-account-btn">
						Create new account
					</a>
				</form>
			</section>

		</div>
	</main>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
